# BoT-SORT tuned for factory CCTV: workers stay in view for minutes and get occluded by machines.
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.3      # start tracks only from reasonably confident detections
track_buffer: 75           # keep lost tracks 3 s at 25 fps (occlusion behind machines)
match_thresh: 0.8
fuse_score: True
gmc_method: none          # camera motion is handled by tracker/motion.py; BoT-SORT's copy cost ~7 ms/frame
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: True            # appearance re-identification reduces ID switches after occlusion
model: auto
